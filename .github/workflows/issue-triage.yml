name: Issue Triage

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  issues: write
  models: read
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-triage-label:
    name: Add triage label
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Add triage label
        run: gh issue edit "$NUMBER" --add-label "triage"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

  triage:
    name: AI triage
    if: github.event.action == 'labeled' && github.event.label.name == 'triage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Security guard
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const text = `${context.payload.issue.title}\n${context.payload.issue.body || ''}`.toLowerCase();
            const patterns = [
              'vulnerab', 'exploit', 'cve-', 'xss', 'csrf', 'rce ',
              'sql injection', 'command injection', 'shell injection',
              'buffer overflow', 'privilege escalation', 'data leak',
              'credential', 'secret key', 'api key', 'auth bypass',
              'ddos', 'denial of service', 'remote code execution',
              'unauthorized access', 'deserial'
            ];
            const hits = patterns.filter((p) => text.includes(p));
            if (hits.length === 0) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: ['security'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: [
                '**Security-related terms detected** in this report. If this involves a security vulnerability, **do not post details publicly**.',
                '',
                'Per the [security policy](https://github.com/zagers/adsb-dashboard/blob/main/SECURITY.md), please report it privately via [GitHub Security Advisories](https://github.com/zagers/adsb-dashboard/security/advisories/new) so a fix can be prepared before disclosure.',
              ].join('\n'),
            });

      - name: Run AI assessment
        id: ai
        uses: github/ai-assessment-comment-labeler@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.issue.number }}
          issue_body: ${{ github.event.issue.body || '' }}
          repo_name: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          ai_review_label: "triage"
          prompts_directory: "./.github/prompts"
          labels_to_prompts_mapping: "triage,triage-type.prompt.yml"
          model: "openai/gpt-4o-mini"
          max_tokens: 300

      - name: Map AI assessment to standard label
        uses: actions/github-script@v7
        env:
          ASSESSMENT_OUTPUT: ${{ steps.ai.outputs.ai_assessments }}
        with:
          script: |
            const raw = process.env.ASSESSMENT_OUTPUT;
            const assessments = JSON.parse(raw || '[]');
            const stdLabels = {
              'bug': 'bug',
              'feature request': 'enhancement',
              'enhancement': 'enhancement',
              'question': 'question',
              'documentation': 'documentation',
            };
            for (const a of assessments) {
              const label = String(a.assessmentLabel || '')
                .replace(/^ai:triage:\s*/i, '')
                .toLowerCase();
              const std = stdLabels[label];
              if (!std) {
                console.log(`No mapping for assessment: ${label}`);
                continue;
              }
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.issue.number,
                labels: [std],
              });
              console.log(`Mapped ${label} -> ${std}`);
            }
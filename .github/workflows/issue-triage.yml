name: Issue Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: triage-${{ github.event_name == 'issue_comment' && 'manual' || 'auto' }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: write # Required for cancelling an in-progress workflow run

defaults:
  run:
    shell: bash

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/triage') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'COLLABORATOR' ||
         github.event.comment.author_association == 'MEMBER'))
    outputs:
      available_labels: ${{ steps.get_labels.outputs.available_labels }}
      selected_labels: ${{ steps.gemini_analysis.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get repository labels
        id: get_labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # ratchet:actions/github-script@v8.0.0
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data)
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map((label) => label.name).sort()
            core.setOutput('available_labels', labelNames.join(','))
            return labelNames

      - name: Build triage prompt
        id: build_prompt
        env:
          AVAILABLE_LABELS: ${{ steps.get_labels.outputs.available_labels }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # ratchet:actions/github-script@v8.0.0
        with:
          script: |-
            const availableLabels = process.env.AVAILABLE_LABELS || '';
            const issueTitle = context.payload.issue?.title || '';
            const issueBody = context.payload.issue?.body || '';
            const commentBody = context.payload.comment?.body || '';

            let issueContext = `Issue Title:\n${issueTitle}\n\nIssue Body:\n${issueBody}`;
            if (commentBody && !commentBody.startsWith('/triage')) {
              issueContext += `\n\nLatest Comment:\n${commentBody}`;
            }

            const promptParts = [
              'You are an automated issue triage assistant for the adsb-dashboard repository (a zero-dependency Go web dashboard for ADS-B receivers on Raspberry Pi).',
              '',
              'Analyze the following issue and select the most appropriate existing labels from the Available Labels list:',
              '',
              'Issue Context:',
              issueContext,
              '',
              'Available Labels (comma-separated):',
              availableLabels,
              '',
              'Triage Guidelines:',
              '1. Security (top priority): If the issue plausibly describes a security vulnerability (e.g. remote code execution, crash/panic/memory corruption from parsing stats.json/aircraft.json, authorization/credential bypass), output ONLY: security',
              '2. Category (choose at most one directly supported label):',
              '   - bug: Broken behavior, error logs, unexpected zero/frozen values, panics, or functional failures.',
              '   - enhancement: New feature request or improvement (do not use "feature", use "enhancement").',
              '   - documentation: Docs, comments, or README updates.',
              '   - question: Usage inquiries or configuration questions.',
              '   - needs-info: When essential details (logs, environment, receiver type) are missing to diagnose.',
              '   - invalid or spam: For spam, gibberish, or test submissions.',
              '3. Priority (choose at most one, only when justified):',
              '   - priority/p0: Active security exploit, data loss, or total dashboard crash.',
              '   - priority/p1: Major regression or blocking defect with no workaround.',
              '   - priority/p2: Normal actionable defect or enhancement.',
              '4. Additional:',
              '   - help wanted or good first issue if suitable for community contributors.',
              '   - duplicate if explicitly identified as a duplicate.',
              '',
              'Output Requirements:',
              '- Output ONLY a comma-separated list of selected labels from the Available Labels list (maximum 4 labels).',
              '- Do NOT include markdown formatting, backticks, code blocks, or explanatory text.',
              '- If no labels apply, output an empty string.'
            ];

            core.setOutput('prompt', promptParts.join('\n'));

      - name: Run Gemini issue analysis
        id: gemini_analysis
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          # Do NOT pass any auth tokens here since this runs on untrusted inputs
          GITHUB_TOKEN: ''
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Explicitly set the issue number to handle `issue_comment` triggers
          # where the context might be ambiguous.
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 1
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: ${{ steps.build_prompt.outputs.prompt }}

  label:
    runs-on: ubuntu-latest
    needs: triage
    if: ${{ needs.triage.outputs.selected_labels != '' }}
    steps:
      - name: Apply labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AVAILABLE_LABELS: ${{ needs.triage.outputs.available_labels }}
          SELECTED_LABELS: ${{ needs.triage.outputs.selected_labels }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # ratchet:actions/github-script@v8.0.0
        with:
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '')
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);

            // Clean up any markdown code fences, backticks, or quotes that might surround the output
            const rawOutput = process.env.SELECTED_LABELS || '';
            const cleaned = rawOutput
              .replace(/```[a-z]*\n?/gi, '')
              .replace(/```/g, '')
              .replace(/["'`]/g, '')
              .trim();

            // Parse the labels as CSV, rejecting anything not in the repo's
            // label set so a prompt-injected payload cannot create arbitrary
            // labels.
            const selectedLabels = cleaned
              .split(',')
              .map((label) => label.trim())
              .filter((label) => availableLabels.includes(label))
              .slice(0, 4)
              .sort();

            const issueNumber = process.env.ISSUE_NUMBER;
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: selectedLabels,
              });
              core.info(`Successfully added labels: ${selectedLabels.join(', ')}`);
            } else {
              core.info(`No valid labels to set for this issue. Raw output was: ${rawOutput}`);
            }